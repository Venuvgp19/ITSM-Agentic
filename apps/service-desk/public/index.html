<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Desk</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #fff;
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: #2563eb; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header p { margin: 1px 0 0; font-size: 12px; color: #6b7280; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: #f1f3f5; color: #1f2937; border-bottom-left-radius: 3px; }
  .msg.ticket { align-self: flex-start; background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; font-weight: 600; }
  .msg.typing { align-self: flex-start; background: #f1f3f5; color: #9ca3af; font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid #e5e7eb;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: inherit;
    max-height: 120px;
  }
  textarea:focus { outline: none; border-color: #2563eb; }
  button {
    border: none;
    background: #2563eb;
    color: #fff;
    padding: 0 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">SD</div>
    <div>
      <h1>Service Desk</h1>
      <p>Tell us what's wrong -- we'll open a ticket for you.</p>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Describe the problem you're having..." autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addBubble('bot', "Hi, I'm the Service Desk assistant. What can I help you with today?");

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;
    const typing = addBubble('typing', 'Thinking...');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      typing.remove();

      addBubble('bot', data.reply || 'Sorry, something went wrong.');
      history.push({ role: 'assistant', content: data.reply || '' });

      if (data.ticket) {
        addBubble('ticket', `Ticket ${data.ticket.number} created.`);
      }
    } catch (err) {
      typing.remove();
      addBubble('bot', "Sorry, I couldn't reach the service desk right now. Please try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
